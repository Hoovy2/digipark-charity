<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity</title>
  </head>
  
  <body>
    <p>Bleeeuuuugghhhhh</p>

    <p id="status">Awaiting scan...</p>

    <script>
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const msg = await response.text();

          if (msg === "SCAN") {
            console.log("Scan detected!");
          }
        }
        catch (error) {
          console.error(error);
        }
      }
      
      setInterval(checkForScan, 1000);
    </script>
  </body>
</html>
