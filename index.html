<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity</title>
  </head>
  
  <body>
    <p>Bleeeuuuugghhhhh</p>

    <p id="status">Message not yet sent...</p>

    <script>
      async function sendScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/scan");

          const msg = await response.text();
          console.log(msg);

          document.getElementById("status").textContent =
            "Message has been sent!";
        }
        catch (error) {
          console.error(error);
        }
      }

      sendScan();
    </script>
  </body>
</html>
