<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
  
  <body>
    <div id="display">
      <div id="advertisement">
        <video autoplay muted loop id="advertisementVideo">
          <source src="33.mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div id="inputPage">
        <p>Please enter your name and take a photo (optional).</p>

        <input type="text" id="name" placeholder="Your name">

        <br><br>

        <input
          type="file"
          id="photo"
          accept="image/*"
          capture="user"
        >

        <br><br>

        <button id="submit">Submit</button>

        <p id="status"></p>
      </div>
    </div>

    <script>
      const nameInput = document.getElementById("name");
      const photoInput = document.getElementById("photo");
      const submitButton = document.getElementById("submit");
      const statusText = document.getElementById("status");

      async function sendScan(name, photo) {
        try {
          const response = await fetch(
            "https://digipark-charity.harvey-brewis.workers.dev/scan",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                name: name,
                photo: photo
              })
            }
          );

          if (response.ok) {
            statusText.textContent = "Thank you!";
          }
          else {
            statusText.textContent = "Something went wrong...";
          }
        }
        catch (error) {
          statusText.textContent = "Something went wrong...";
          console.error(error);
        }
      }

      submitButton.addEventListener("click", () => {
        const name = nameInput.value.trim();
        const photo = photoInput.files[0];

        if (!name) {
          statusText.textContent = "Please enter your name";
          return;
        }

        statusText.textContent = "Sending...";

        // gotta convert to data url :P
        if (photo) {
          const reader = new FileReader();

          reader.addEventListener("load", () => {
            const photoData = reader.result;
            sendScan(name, photoData);
          });

          reader.readAsDataURL(photo);
        }
        else {
          sendScan(name, null);
        }
      });
    </script>
  </body>
</html>
