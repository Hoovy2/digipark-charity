<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity Display</title>
  </head>
  
  <body>
    <p>Bleeughh,,,,,,</p>

    <p id="status">I haven't recieved a scan yet!</p>

    <script>
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const msg = await response.text();

          if (msg === "SCAN") {
            document.getElementById("status").textContent = "I have recieved a scan!";
            console.log("Scan recieved!");
          }
        }
        catch (error) {
          console.error(error);
        }
      }

      setInterval(checkForScan, 1000);
    </script>
  </body>
</html>
