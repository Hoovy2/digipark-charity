<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity Display</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
  
  <body>
    <div id="display">
      <div id="advertisement">
        <video autoplay muted loop id="advertisementVideo">
          <source src="33.mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div id="donationOverlay">
        Daily Total: $0.00
      </div>
      <div id="thanksOverlay">
         <h1>Thank you for your donation!</h1>
         <img src="orrca.png">
      </div>
    </div>

    <input type="file" id="fileUpload" accept="video/*" hidden>
    
    <script>
      const donationOverlay = document.getElementById("donationOverlay");
      const fileUpload = document.getElementById("fileUpload");
      const video = document.getElementById("advertisementVideo");
      const thanksOverlay = document.getElementById("thanksOverlay");
      const advertisement = document.getElementById("advertisement");
      
      let total;
      let visibility;
      let uploadEnabled;

      function updateSettings() {
        visibility = localStorage.getItem("dailyCounterVisibility") || "never";
        total = Number(localStorage.getItem("dailyTotal")) || 0;
        uploadEnabled = localStorage.getItem("uploadEnabled") === "true";
        
        if (visibility === "always") {
          donationOverlay.classList.add("visible");
        }

        else if (visibility === "never") {
          donationOverlay.classList.remove("visible");
        }

        donationOverlay.textContent = "Daily Total: $" + total + ".00";

        if (uploadEnabled) {
          fileUpload.hidden = false;
          advertisement.hidden = true;
        }
        else {
          fileUpload.hidden = true;
          advertisement.hidden = false;
        }
      }

      function scan(scans) {
        total += 2 * scans;
        document.getElementById("donationOverlay").textContent = "Daily Total: $" + total + ".00";
        localStorage.setItem("dailyTotal", total);

        if (visibility === "onScan") {
          donationOverlay.classList.add("visible");
          setTimeout(() => {
            donationOverlay.classList.remove("visible");
          }, 8000);
        }

        thanksOverlay.classList.add("visible");
        setTimeout(() => {
          thanksOverlay.classList.remove("visible");
        }, 8000);

        console.log("I'm processing a scan");
      }
      
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const data = await response.json();

          if (data.scans > 0) {
            scan(data.scans);
          }
        }
        catch (error) {
          console.error(error);
        }

        console.log("I'm checking for a scan");
      }

      fileUpload.addEventListener("change", () => {
        const file = fileUpload.files[0];

        if (!file) {
          return;
        }

        const videoURL = URL.createObjectURL(file);
        video.src = videoURL;
        
        video.play();
      })

      setInterval(updateSettings, 1000);
      setInterval(checkForScan, 1000);

      updateSettings();
      checkForScan();
      scan(0);
    </script>
  </body>
</html>
