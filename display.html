      <div

      <div

      <div

      </div>

      <div
        class="fishWrapper"

        data-normal="HeniochusFish.svg"
        data-flipped="HeniochusFishFlipped.svg"
        style="z-index: 6;"
      >
        <div class="fishBorder"></div>
        <div class="fish"></div>
      </div>

      <div
        class="fishWrapper"
        data-x-pos="0"
        data-normal="BlueBeltFish.svg"
        data-flipped="BlueBeltFishFlipped.svg"
        style="z-index: 7;"
      >
        <div class="fishBorder"></div>
        <div class="fish"></div>
      </div>

      <div

        data-x-pos="1"

      <div

      <div
        class="fishWrapper"
        data-x-pos="1"

        style="z-index: 10;"
      >
        <div class="fishBorder"></div>
        <div class="fish"></div>
      </div>

      <div
        class="fishWrapper"
        data-x-pos="0"
        data-normal="BlueBeltFish.svg"
        data-flipped="BlueBeltFishFlipped.svg"
        style="z-index: 11;"
      >
        <div class="fishBorder"></div>
        <div class="fish"></div>
      </div>

      <div
        class="fishWrapper"
        data-x-pos="1"
        data-normal="ButterflyFish.svg"
        data-flipped="ButterflyFishFlipped.svg"
        style="z-index: 12;"
      >
        <div class="fishBorder"></div>
        <div class="fish"></div>
      </div>
    </div>
    <div id="display">
      <div id="advertisement">
        <video autoplay muted loop id="advertisementVideo">
          <source src="33.mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div id="donationOverlay">
        DAILY TOTAL: $0.00
      </div>
      <div id="thanksOverlay">
        <h1>Thank you for your donation,</h1>
        <h1 id="thanksOverlayText">sample name</h1>
        <img src="orrca.png">
      </div>
      <div id="qrOverlay">
        <img src="QR.png">
        <h1>Ocean Guardian <br> Scan the QR code for your donation</h1>
      </div>
      <img src="orrca.png" style="position: absolute; right: 5%; top: 5%; max-width: 20vw; max-height: 20vw;">
      <img src="digipark.png" style="position: absolute; left: 5%; top: 5%; max-width: 20vw; max-height: 20vw;">
    </div>

    <input type="file" id="fileUpload" accept="video/*" hidden>
    
    <script>
      const donationOverlay = document.getElementById("donationOverlay");
      const fileUpload = document.getElementById("fileUpload");
      const video = document.getElementById("advertisementVideo");
      const thanksOverlay = document.getElementById("thanksOverlay");
      const advertisement = document.getElementById("advertisement");
      const thanksOverlayText = document.getElementById("thanksOverlayText");
      const fish = document.querySelectorAll("div.fish");
      const fishWrapper = document.querySelectorAll("div.fishWrapper");

      const numFish = 12;
      const randomness = 30;

      const donationQueue = [];
      let fishAnimationRunning = false;
      
      let total;
      let visibility;
      let uploadEnabled;

      function updateSettings() {
        visibility = localStorage.getItem("dailyCounterVisibility") || "never";
        total = Number(localStorage.getItem("dailyTotal")) || 0;
        uploadEnabled = localStorage.getItem("uploadEnabled") === "true";
        
        if (visibility === "always") {
          donationOverlay.classList.add("visible");
        }

        else if (visibility === "never") {
          donationOverlay.classList.remove("visible");
        }

        donationOverlay.textContent = "Daily Total: $" + total + ".00";

        if (uploadEnabled) {
          fileUpload.hidden = false;
          advertisement.hidden = true;
        }
        else {
          fileUpload.hidden = true;
          advertisement.hidden = false;
        }
      }

      function scan(donation) {
        total += 2;
        document.getElementById("donationOverlay").textContent = "Daily Total: $" + total + ".00";
        localStorage.setItem("dailyTotal", total);

        thanksOverlayText.textContent = donation.name + "!";

        if (donation.photo) {
          console.log("Changing donation photo!");
          updateFish(donation.photo);
        }

        if (visibility === "onScan") {
          donationOverlay.classList.add("visible");
          setTimeout(() => {
            donationOverlay.classList.remove("visible");
          }, 10000);
        }

        thanksOverlay.classList.add("visible");
        setTimeout(() => {
          thanksOverlay.classList.remove("visible");
        }, 10000);
      }

      function animateFish(fihWrapper) {
        const index = Number(fihWrapper.style.zIndex);
        let xPos = Number(fihWrapper.dataset.xPos);

        let dir = xPos * 2 - 1;
        const height = (index / numFish).toFixed(2);
        const random1 = Math.floor(Math.random() * randomness) - randomness / 2;
        const random2 = Math.floor(Math.random() * randomness) - randomness / 2;
        const random3 = Math.floor(Math.random() * 2500) + 6500;
        const random4 = random3;

        const fish = fihWrapper.querySelector(".fish");
        const fishBorder = fihWrapper.querySelector(".fishBorder");

        const fishURL = dir === 1
          ? fihWrapper.dataset.flipped
          : fihWrapper.dataset.normal;

        fish.style.maskImage = `url("${fishURL}")`;
        fishBorder.style.maskImage = `url("${fishURL}")`;

        fihWrapper.style.transitionDuration = `${random3}ms`;
        fihWrapper.style.transitionDelay = "500ms";

        fihWrapper.style.translate = `calc((50vw + 50%) * ${dir}) calc(80vh * ${height} + ${random2}vh - 40vh)`;

        xPos = 1 - xPos;
        fihWrapper.dataset.xPos = xPos;
        setTimeout(animateFish, 3500 + random4, fihWrapper);
      }

      function updateFish(newPhoto) {
        fishWrapper.forEach((fihWrapper) => {
          const zIndex = Number(fihWrapper.style.zIndex) - 1;
          fihWrapper.style.zIndex = zIndex;

          console.log(zIndex);

          if (zIndex === 0) {
            fihWrapper.style.zIndex = numFish;
            const fih = fihWrapper.querySelector("div.fish")
            fih.style.backgroundImage = `url("${newPhoto}")`;
          }
        })
      }
      
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const data = await response.json();

          if (data.donation) {
            scan(data.donation);
          }
        }
        catch (error) {
          console.error(error);
        }
      }

      fileUpload.addEventListener("change", () => {
        const file = fileUpload.files[0];

        if (!file) {
          return;
        }

        const videoURL = URL.createObjectURL(file);
        video.src = videoURL;
        
        video.play();
      })

      setInterval(updateSettings, 1000);
      setInterval(checkForScan, 1000);

      updateSettings();
      checkForScan();

        fishWrapper.forEach((fihWrapper) => {
          animateFish(fihWrapper);
        });
    </script>
  </body>
</html>
