<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity Display</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
  
  <body>
    <div id="display">
      <div id="advertisement">
        <video autoplay muted loop >
          <source src="Hyrax.mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div id="donationOverlay">
        Daily Total: $0.00
      </div>
    </div>
    
    <script>
      const overlay = document.getElementById("donationOverlay");
      
      let total;
      let visibility;

      updateSettings();

      function updateSettings() {
        visibility = localStorage.getItem("dailyCounterVisibility") || "always";
        total = Number(localStorage.getItem("dailyTotal")) || 0;

        if (visibility === "always") {
          overlay.style.display = "block";
        }

        else if (visibility === "never") {
          overlay.style.display = "none";
        }
      }

      function scan(scans) {
        total += 2 * scans;
        document.getElementById("donationOverlay").textContent = "Daily Total: $" + total + ".00";
        localStorage.setItem("dailyTotal", total);

        if (visibility === "onClick") {
          overlay.style.display = "block";
          setTimeout(() => {
            overlay.style.display = "none";
          }, 5000);
        }
      }
      
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const data = await response.json();

          if (data.scans > 0) {
            scan(data.scans);
          }
        }
        catch (error) {
          console.error(error);
        }
      }

      setInterval(checkForScan, 1000);
      setInterval(updateSettings, 1000);
    </script>
  </body>
</html>
