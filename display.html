<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity Display</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
  
  <body>
    <div id="display">
      <div class="fishWrapper" data-numMoves="0" style="z-index: 1;">
        <div class="fish" style="mask-image: url('AngelFish.svg');"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 2;">
        <div class="fish" style="mask-image: url('fih.svg');"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 3;">
        <div class="fish" style="mask-image: url('AngelFish.svg');"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 4;">
        <div class="fish" style="mask-image: url('fih.svg');"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 5;">
        <div class="fish" style="mask-image: url('AngelFish.svg');"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 6;">
        <div class="fish" style="mask-image: url('fih.svg');"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 7;">
        <div class="fish"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 8;">
        <div class="fish"></div>
      </div>
      <div class="fishWrapper" data-numMoves="0" style="z-index: 9;">
        <div class="fish"></div>
      </div>
      <div id="advertisement">
        <video autoplay muted loop id="advertisementVideo">
          <source src="33.mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div id="donationOverlay">
        DAILY TOTAL: $0.00
      </div>
      <div id="thanksOverlay">
        <h1>Thank you for your donation,</h1>
        <h1 id="thanksOverlayText">hi :3</h1>
        <img src="orrca.png">
      </div>
      <div id="qrOverlay">
        <img src="QR.png">
        <h1>Ocean Guardian</h1>
        <h1>Scan the QR code for your donation</h1>
      </div>
      <img src="orrca.png" style="position: absolute; right: 5%; top: 5%; max-width: 20vw; max-height: 20vw;">
      <img src="digipark.png" style="position: absolute; left: 5%; top: 5%; max-width: 20vw; max-height: 20vw;">
    </div>

    <input type="file" id="fileUpload" accept="video/*" hidden>
    
    <script>
      const donationOverlay = document.getElementById("donationOverlay");
      const fileUpload = document.getElementById("fileUpload");
      const video = document.getElementById("advertisementVideo");
      const thanksOverlay = document.getElementById("thanksOverlay");
      const advertisement = document.getElementById("advertisement");
      const thanksOverlayText = document.getElementById("thanksOverlayText");
      const fish = document.querySelectorAll("div.fish");
      const fishWrapper = document.querySelectorAll("div.fishWrapper");

      const numFish = 9;
      const maxMovements = 4;
      const randomness = 30;

      const donationQueue = [];
      let fishAnimationRunning = false;

      function processNextDonation() {
        console.log("processing next donation")

        if (fishAnimationRunning || donationQueue.length === 0) {
          return;
        }

        fishAnimationRunning = true;
        const donation = donationQueue.shift(); // FIFO
        scan(donation);
      }
      
      let total;
      let visibility;
      let uploadEnabled;

      function updateSettings() {
        visibility = localStorage.getItem("dailyCounterVisibility") || "never";
        total = Number(localStorage.getItem("dailyTotal")) || 0;
        uploadEnabled = localStorage.getItem("uploadEnabled") === "true";
        
        if (visibility === "always") {
          donationOverlay.classList.add("visible");
        }

        else if (visibility === "never") {
          donationOverlay.classList.remove("visible");
        }

        donationOverlay.textContent = "Daily Total: $" + total + ".00";

        if (uploadEnabled) {
          fileUpload.hidden = false;
          advertisement.hidden = true;
        }
        else {
          fileUpload.hidden = true;
          advertisement.hidden = false;
        }
      }

      function scan(donation) {
        total += 2;
        document.getElementById("donationOverlay").textContent = "Daily Total: $" + total + ".00";
        localStorage.setItem("dailyTotal", total);

        thanksOverlayText.textContent = donation.name + "!";

        if (donation.photo) {
          fish.forEach((fih) => {
            fih.style.backgroundImage = `url("${donation.photo}")`;
          })
          fishWrapper.forEach((fihWrapper) => {
            fihWrapper.dataset.numMovements = 0;
            animateFish(fihWrapper);
          })
        }

        if (visibility === "onScan") {
          donationOverlay.classList.add("visible");
          setTimeout(() => {
            donationOverlay.classList.remove("visible");
          }, 10000);
        }

        thanksOverlay.classList.add("visible");
        setTimeout(() => {
          thanksOverlay.classList.remove("visible");
        }, 10000);
      }

      function animateFish(fihWrapper) {
        const fih = fihWrapper.querySelector("div.fish");
        const index = Number(fihWrapper.style.zIndex);
        let numMovements = Number(fihWrapper.dataset.numMovements);

        let dir = (index + numMovements) % 2 * 2 - 1;
        const height = (index / numFish).toFixed(2);
        let random1 = Math.floor(Math.random() * randomness) - randomness / 2;
        const random2 = Math.floor(Math.random() * randomness) - randomness / 2;
        const random3 = Math.floor(Math.random() * 2500) + 1500;

        if (numMovements === 0) {
          thanksOverlay.style.zIndex = 999;
          random1 = 35;
          setTimeout(() => {
            fih.style.opacity = "1";
          }, 500)
          setTimeout(() => {
            thanksOverlay.style.zIndex = 0;
          }, 3000);
        }

        if (numMovements === maxMovements) {
          fih.style.transform = `scaleX(calc(0 - ${dir}))`;
          fihWrapper.style.transform = `translate(calc(5000px * ${dir}), calc(500px * ${random1}))`;
          numMovements = 0;
          fihWrapper.dataset.numMovements = numMovements;

          setTimeout(() => {
            fihWrapper.style.transform = `translate(-50%, -50%)`;
            fih.style.opacity = "0";

            setTimeout(() => {
              fishAnimationRunning = false;
              processNextDonation();
            }, 3000);
          }, 6000);

          return;
        } else {
          fih.style.transform = `scaleX(calc(${dir} * -1))`;
          fihWrapper.style.transform = `translate(calc((25vw + ${random1}vw) * ${dir} - 50%), calc(100vh * ${height} + ${random2}vh - 50vh - 50%))`;
        }

        fihWrapper.style.transition = `transform ${random3}ms ease-in-out 500ms`;

        numMovements++;
        fihWrapper.dataset.numMovements = numMovements;
        setTimeout(animateFish, 3500 + random3, fihWrapper);
      }
      
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const data = await response.json();

          if (data.donation) {
            console.log("donation being processed");

            donationQueue.push(data.donation);

            console.log(fishAnimationRunning);

            processNextDonation();
          }
        }
        catch (error) {
          console.error(error);
        }
      }

      fileUpload.addEventListener("change", () => {
        const file = fileUpload.files[0];

        if (!file) {
          return;
        }

        const videoURL = URL.createObjectURL(file);
        video.src = videoURL;
        
        video.play();
      })

      setInterval(updateSettings, 1000);
      setInterval(checkForScan, 1000);

      updateSettings();
      checkForScan();
    </script>
  </body>
</html>
