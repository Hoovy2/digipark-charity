<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPark Charity Display</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
  
  <body>
    <div id="display">
      <video autoplay muted loop>
        <source src="Hyrax.mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    
    <script>
      async function checkForScan() {
        try {
          const response = await fetch("https://digipark-charity.harvey-brewis.workers.dev/status");
          const msg = await response.text();

          if (msg === "SCAN") {
            console.log("Scan recieved!");
          }
        }
        catch (error) {
          console.error(error);
        }
      }

      setInterval(checkForScan, 1000);
    </script>
  </body>
</html>
